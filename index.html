<!DOCTYPE html>
<html>
    <head>
        <title>Weather Application</title>
        <link rel="stylesheet" href="assets/css/style.css">
        <link rel="icon" href="assets/images/env3.jpg">
    </head>
    <body>

        <div class="card">
            <div class="search">
                <input type="text" placeholder="Enter city name" spellcheck="false">
                <button> <img src="assets/images/search.png" alt="Search"> </button>
            </div>
            <div class="weather">
                <img src="assets/images/rainy-day.png" class="weather-icon">
                <h1 class="temp">20°C</h1>
                <h2 class="city">New York</h2>
                <div class="details">
                    <div class="col">
                        <img src="assets/images/humidity.png">
                        <div>
                            <p class="humidity">50%</p>
                            <p>Humidity</p>
                        </div>
                    </div>
                    <div class="col">
                        <img src="assets/images/wind.png">
                        <div>
                            <p class="wind">20 km/h</p>
                            <p>Wind Speed</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="assets/js/app.js"></script>
    </body>
</html>
